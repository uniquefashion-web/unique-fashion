/* ===== Reference-inspired UNIQUE Menswear storefront ===== */
:root{
 --bg:#f5f0e9;--panel:#fffaf4;--cream:#e8c79f;--muted:#77716b;
 --line:#e4d9cd;--white:#171513;
}
body{background:#f6f1eb;color:#171513;font-family:'DM Sans',Arial,sans-serif}
.top{background:#11100f;color:#eee;border:0}
.top span{color:#e8c79f}
header{height:78px;background:#090909;border-bottom:1px solid #292522}
.brand img{width:205px;mix-blend-mode:screen}
.nav{font-size:12px;font-weight:600;letter-spacing:.025em}
.nav a{color:#f6f1eb}
.nav a:hover{color:#e8c79f}
.iconbtn{color:#f6f1eb}
.count{background:#e8c79f;color:#171513}
.hero{min-height:clamp(390px,42vw,560px);padding:55px 7%;background:#111}
.hero-background{object-position:center 32%;filter:saturate(.82)}
.hero:before{background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 42%,rgba(0,0,0,.06) 100%)}
.hero-copy{max-width:470px}
.eyebrow{color:#f0d2ad;letter-spacing:.28em}
.hero h1{font:600 clamp(42px,5vw,66px)/.98 'Playfair Display',serif;color:#f8f3ed;letter-spacing:-.035em}
.hero h1 em,.hero h1 span{color:#e8c79f}
.hero p{font-size:13px;letter-spacing:.01em;color:#f2eee8}
.btn{background:#e8c79f;color:#111;border-radius:3px;padding:13px 22px;font-weight:700}
.btn:hover{background:#f3d9b9}
.dots i{background:#877a6e;border-radius:0}
.dots i.active{background:#e8c79f}
.audiences{display:none}
.benefits{background:#f3ece4;border:0;border-bottom:1px solid #e3d8cd;padding:15px 5%;gap:8px}
.benefit{border-right:1px solid #d8ccc0;padding:0 12px;color:#171513}
.benefit b{font-size:11px;color:#171513}
.benefit small{font-size:10px;color:#756d65}
.benefit .sym{font-size:22px;color:#171513}
section{padding:30px 5%;background:#f8f4ef}
.section-head{margin-bottom:18px}
.section-head h2{font:600 27px 'Playfair Display',serif;color:#171513}
.view{color:#6f5740;font-weight:700}
.categories{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cat{text-align:center;color:#171513;font-size:11px;font-weight:600}
.cat img{aspect-ratio:1/1;border-radius:8px;background:#e9e0d7;border:0;margin-bottom:7px;object-fit:cover}
.cat:hover img{transform:translateY(-3px)}
.tabs{gap:10px}
.tabs button{color:#514b45;border:1px solid #ddd1c5;border-radius:3px;padding:8px 13px}
.tabs button.active{background:#171513;color:#fff;border-color:#171513}
.products{grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.product .photo{border-radius:7px;background:#e9e0d7;aspect-ratio:.82}
.product img{filter:none}
.heart{background:rgba(255,255,255,.88);color:#171513;border-radius:50%}
.tag{background:#171513;color:#f3d4b1;border-radius:2px}
.pinfo{padding:10px 2px}
.pinfo h3{font-size:12px;font-weight:600;color:#171513}
.price{font-size:14px;color:#171513;font-weight:700}
.old{color:#8b8178}
.variant-row select{background:#fffaf4;color:#171513;border:1px solid #d8cbbd}
.add{background:#111;color:#fff;border:1px solid #111;border-radius:3px;font-weight:600}
.details-link{color:#6c5038}
.detail-box{background:#fffaf4;border:1px solid #d9cabb;border-radius:8px}
.detail-copy h2{color:#171513}
.detail-copy p{color:#655d55}
.detail-price{color:#171513}
